[build-system]
build-backend = "rapids_build_backend.build"
requires = [
    "rapids-build-backend>=0.4.0,<0.5.0",
    "scikit-build-core[pyproject]>=0.11.0",
] # This list was generated by `rapids-dependency-file-generator`. To make changes, edit ../../dependencies.yaml and run `rapids-dependency-file-generator`.

[project]
name = "amd-pylibhipdf"
dynamic = ["version"]
description = "pylibhipdf - Python bindings for libhipdf"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "Advanced Micro Devices, Inc." },
    { name = "NVIDIA Corporation" },
]
license = "Apache-2.0 AND MIT"
requires-python = ">=3.11"
dependencies = [
    "amd-cupy>=13.5.1",
    "amd-hipmm==5.0.*,>=5.0.0a0",
    "amd-libhipdf==3.*,>=3.0.00",
    "hip-python>=7.0",
    "hip-python-interop>=7.0",
    "numba-hip>=0.0.2",
    # "nvtx>=0.2.1", # TODO(HIP/AMD): find replacement
    "packaging",
    "typing_extensions>=4.0.0",
] # This list was generated by `rapids-dependency-file-generator`. To make changes, edit ../../dependencies.yaml and run `rapids-dependency-file-generator`.
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
test = [
    "cupy-cuda13x>=13.6.0,!=14.0.0,!=14.1.0",
    "fastavro>=0.22.9",
    "hypothesis>=6.131.7",
    "mmh3",
    "nanoarrow",
    "numba-cuda>=0.22.2,<0.29.0",
    "numba>=0.60.0,<0.65.0",
    "pandas>=2.0,<2.4.0",
    "pyarrow>=19.0.0,<24",
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "xxhash",
] # This list was generated by `rapids-dependency-file-generator`. To make changes, edit ../../dependencies.yaml and run `rapids-dependency-file-generator`.
pyarrow = [
    "pyarrow>=19.0.0,<24",
] # This list was generated by `rapids-dependency-file-generator`. To make changes, edit ../../dependencies.yaml and run `rapids-dependency-file-generator`.
numpy = [
    "numpy>=1.26,<3.0",
] # This list was generated by `rapids-dependency-file-generator`. To make changes, edit ../../dependencies.yaml and run `rapids-dependency-file-generator`.

[project.urls]
Homepage = "https://github.com/ROCm-DS/hipDF"
Documentation = "https://instinct.docs.amd.com/latest/data-science/hipDF.html"

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint]
extend-select = [
  "TCH", # flake8-type-checking
  "TID", # flake8-tidy-imports
  "PT", # flake8-pytest-style
]
extend-ignore = [
  "PT011", # pytest.raises(...) is too broad
]

[tool.ruff.lint.flake8-pytest-style]
# https://docs.astral.sh/ruff/settings/#lintflake8-pytest-style
fixture-parentheses = false
mark-parentheses = false
parametrize-names-type = "csv"
parametrize-values-type = "list"
parametrize-values-row-type = "tuple"

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["pylibcudf"]
section-order = ["future", "standard-library", "third-party", "rapids", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
rapids = ["rmm"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]

[tool.pydistcheck]
select = [
    "distro-too-large-compressed",
]

# PyPI hard limit is 1GiB, but try to keep this as small as possible
max_allowed_size_compressed = '20M'

[tool.pytest.ini_options]
# --import-mode=importlib because two test_json.py exists and tests directory is not a structured module
addopts = "--tb=native --strict-config --strict-markers --import-mode=importlib"
markers = [
  "uses_custom_stream: Test uses custom Stream object",
]
empty_parameter_set_mark = "fail_at_collect"
filterwarnings = [
  "error",
  "ignore:::.*xdist.*",
  "ignore:::.*pytest.*",
]
xfail_strict = true

[tool.rapids-build-backend]
build-backend = "scikit_build_core.build"
commit-files = [
  "pylibcudf/COMMIT"
]
dependencies-file = "../../dependencies.yaml"
matrix-entry = "cuda_suffixed=true;use_cuda_wheels=true"
requires = [
    "amd-hipmm==5.0.*,>=5.0.0a0",
    "amd-libhipdf==3.*,>=3.0.0a0",
    "amd-libhipmm==5.0.*,>=5.0.0a0",
    "cmake>=3.30.4",
    "cython>=3.2.2",
    "ninja",
] # This list was generated by `rapids-dependency-file-generator`. To make changes, edit ../../dependencies.yaml and run `rapids-dependency-file-generator`.

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
cmake.version = "CMakeLists.txt"
minimum-version = "build-system.requires"
ninja.make-fallback = false
sdist.exclude = ["*tests*"]
sdist.reproducible = true
wheel.packages = ["pylibcudf", "pylibhipdf"]
wheel.py-api = "cp311" # overridden in CI builds by arguments from `ci/build_wheel_*.sh` scripts.

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "pylibcudf/VERSION"
regex = "(?P<value>.*)"
