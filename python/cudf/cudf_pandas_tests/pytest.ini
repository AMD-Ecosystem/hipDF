# Note, this config file overrides the default "cudf" test config in
# ../pyproject.toml We do so deliberately because we have different
# treatment of markers and warnings
[pytest]
addopts = --tb=native --strict-config --strict-markers
empty_parameter_set_mark = fail_at_collect
xfail_strict = true
# Tests here drive third-party C extensions that can block the main thread
# outside the interpreter, where pytest-timeout's default signal method never
# fires. The thread method interrupts those.
timeout_method = thread
markers =
    serial: Mark a test as not being parallel-safe.
